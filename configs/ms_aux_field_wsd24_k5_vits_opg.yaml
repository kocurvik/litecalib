# LiteCalib ViT-S: as the ViT-L model, the lightweight recipe.
#   python train/train.py --config configs/ms_aux_field_wsd24_k5_vits_opg.yaml
#   ... --submitit to run it on SLURM (see slurm.py)

data: [openpano_v2_gen+commons_gen+commons_sa_gen, megascenes_dist]
backbone: vits14
init: dinov2
profile: field
K: 5
field_repr: fov
decoder_layers: 2
dense_loss_weight: 1.0
dense_dim: 64
epochs: 24
samples_per_dataset: 72000
no_preload: [megascenes_dist]
batch_size: 24
lr: 1.0e-4
backbone_lr: 1.0e-5
weight_decay: 0.05
warmup_steps: 1000
lr_schedule: wsd
decay_epochs: 5
nll_after: 1000000
gpu_pipeline: true
resume: true
timeout_min: 1380
workers: 8
tag: ms_aux_field_wsd24_k5
no_progress: true
log_every: 100
