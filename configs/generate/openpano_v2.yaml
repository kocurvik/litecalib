# OP_p: AnyCalib's perspective recipe (`siclib/datasets/configs/openpano_v2.yaml`) on OpenPano; every view a pinhole.
#   python data_utils/generate_views.py openpano_v2   (--submitit for SLURM)
# `???`: filled in from configs/paths (the panorama root); the views land in <root>/<name>/.

name: openpano_v2
base_dir: ???
images_per_pano: 16
resize_factor: null
parameter_dists:
  roll:
    type: uniform # uni[-45, 45]
    options:
      loc: -0.7853981633974483 # -45 degrees
      scale: 1.5707963267948966 # 90 degrees
  pitch:
    type: uniform # uni[-45, 45]
    options:
      loc: -0.7853981633974483 # -45 degrees
      scale: 1.5707963267948966 # 90 degrees
  vfov:
    type: uniform # uni[20, 105]
    options:
      loc: 0.3490658503988659 # 20 degrees
      scale: 1.48352986419518 # 85 degrees
  resize_factor:
    type: uniform
    options:
      loc: 1.2
      scale: 0.5
  shape:
    type: fix
    value:
      - 640
      - 640
